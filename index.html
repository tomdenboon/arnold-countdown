
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown – Arnold zijn bestuurlijke verplichtingen</title>
  <style>
    :root { --bg:#0b1020; --fg:#e5e7eb; --accent:#60a5fa; --card:#111827; --border:#1f2937; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial;
      display:grid; place-items:center; min-height:100vh; text-align:center; }
    .container { max-width:960px; padding:2rem; }
    h1 { font-size:clamp(1.6rem,2.8vw,2.8rem); font-weight:800; margin:0 0 1rem; }
    .target { opacity:.85; margin-bottom:2rem; font-weight:600; }
    .big { font-variant-numeric:tabular-nums; font-size:clamp(2.5rem,7vw,6rem); line-height:1.1; font-weight:800; letter-spacing:.02em; }
    .label { color:var(--accent); font-weight:700; margin-top:.5rem; text-transform:uppercase; letter-spacing:.06em; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-top:2rem; }
    .tile { background:var(--card); border:1px solid var(--border); border-radius:.9rem; padding:1.2rem; }
    .tile .num { font-size:clamp(1.6rem,4vw,3rem); font-weight:800; font-variant-numeric:tabular-nums; }
    .tile .name { opacity:.8; margin-top:.35rem; font-weight:600; }
    footer { margin-top:2rem; opacity:.7; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Countdown tot einde van Arnold zijn bestuurlijke verplichtingen</h1>
    <div class="target">Einddatum: <strong>6 juni 2027</strong> (lokale tijd)</div>

    <div id="seconds" class="big">47,214,753</div>
    <div class="label">resterende seconden</div>

    <div class="grid">
      <div class="tile"><div class="num" id="days">–</div><div class="name">dagen</div></div>
      <div class="tile"><div class="num" id="hours">–</div><div class="name">uren</div></div>
      <div class="tile"><div class="num" id="minutes">–</div><div class="name">minuten</div></div>
      <div class="tile"><div class="num" id="secs">–</div><div class="name">seconden</div></div>
    </div>

    <footer>Live teller – ververst elke seconde</footer>
  </div>

  <script>
    // Eindtijd in lokale tijdzone van de browser
    const end = new Date(2027, 5, 6, 0, 0, 0); // 5 = juni (0-based)
    function update() {
      const now = new Date();
      let diff = Math.floor((end - now) / 1000);
      if (diff < 0) diff = 0;
      document.getElementById('seconds').textContent = diff.toLocaleString('nl-NL');
      const days = Math.floor(diff / 86400);
      const hours = Math.floor((diff % 86400) / 3600);
      const mins = Math.floor((diff % 3600) / 60);
      const secs = diff % 60;
      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(mins).padStart(2, '0');
      document.getElementById('secs').textContent = String(secs).padStart(2, '0');
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
